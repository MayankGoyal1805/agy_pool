[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-pool"
version = "0.2.0"
description = "Antigravity Multi-Account Pool & Live Tmux Split Grid Manager"
readme = "README.md"
authors = [
    { name = "Mayank Goyal" }
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
agy-pool = "agy_pool.cli:main"
